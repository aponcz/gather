name: Deploy backend to stage

on:
  # push:
  #   branches:
  #     - master
  #     - feature/ap/backend-frontend-integration
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-stage
  cancel-in-progress: false

jobs:
  deploy-ecs:
    runs-on: ubuntu-latest
    env:
      ECS_CLUSTER: stage-ecs-cluster
      ECS_SERVICE: stage-gather-web
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure AWS credentials from OIDC
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::195698602349:role/gather-stage-github-oidc-role
          aws-region: us-east-1
          output-credentials: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Build & Push (direct to ECR, with cache)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.deploy
          platforms: linux/amd64
          push: true
          tags: |
            195698602349.dkr.ecr.us-east-1.amazonaws.com/stage/gather-backend:latest
            195698602349.dkr.ecr.us-east-1.amazonaws.com/stage/gather-backend:${{ github.sha }}
          build-args: |
            ASSET_BUCKET=gather-stage-assets
            ASSET_HOST=https://gather-stage-assets.s3.amazonaws.com
            CLIENT_APP_URL=https://app.gather.stage.goprotext.com
            GOPROTEXT_OAUTH_AUTHORIZE_URL=https://id.stage.goprotext.com/oauth/authorize
            GOPROTEXT_OAUTH_TOKEN_URL=https://id.stage.goprotext.com/oauth/token
            GOPROTEXT_OAUTH_USERINFO_URL=https://id.stage.goprotext.com/api/v2/me
            GOPROTEXT_LOANS_URL=https://id.stage.goprotext.com/api/v2/loans
            GOPROTEXT_OAUTH_TOKEN_GRANT_TYPE=refresh_token
            GOPROTEXT_OAUTH_REDIRECT_URI=https://backend.gather.stage.goprotext.com/api/v1/auth/oauth/goprotext/callback
            GOPROTEXT_OAUTH_SCOPE="public loan_read loan_write loan_closing_requirements"
            FRONTEND_OAUTH_CALLBACK_URL=https://app.gather.stage.goprotext.com/login/oauth-callback
            S3_BUCKET=stage-gather-uploads
            S3_FORCE_PATH_STYLE="true"

          secrets: |
            "aws_access_key_id=${{ steps.aws_creds.outputs.aws-access-key-id }}"
            "aws_secret_access_key=${{ steps.aws_creds.outputs.aws-secret-access-key }}"
            "aws_session_token=${{ steps.aws_creds.outputs.aws-session-token }}"
          cache-from: type=gha,scope=gather-backend
          cache-to: type=gha,mode=max,scope=gather-backend
          provenance: false

      - name: Generate Task Definition JSON
        working-directory: backend
        run: ruby .aws/generate_task_definition
        env:
          AWS_ACCOUNT_ID: '195698602349'
          AWS_ENV: stage
          TAG: ${{ github.sha }}

      - name: Deploy to Amazon ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ./backend/.aws/taskdefinition.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
