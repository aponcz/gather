name: Deploy frontend to stage

on:
  # push:
  #   branches:
  #     - master
  #     - feature/ap/backend-frontend-integration
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-stage
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: stage
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://backend.gather.stage.goprotext.com
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::195698602349:role/gather-stage-github-oidc-role
          aws-region: us-east-1

      - name: Deploy to stage S3 bucket
        run: aws s3 sync dist/ s3://gather.stage.goprotext.com/ --delete
